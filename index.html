<script>
const D = JSON.parse(document.getElementById('DATA').textContent);
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const initials = s => [...s].map(c => {
  const i = c.charCodeAt(0) - 0xAC00;
  return (i >= 0 && i <= 11171) ? CHO[Math.floor(i / 588)] : c;
}).join('');
const col = new Intl.Collator('ko', {numeric: true, sensitivity: 'base'});
D.players.sort((a, b) => col.compare(a.name, b.name));
document.getElementById('sub').textContent =
  D.players.length + '명 · 솔로랭크만 · ' + D.note;
document.getElementById('foot').textContent = '생성 ' + D.built;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rosterEl = document.getElementById('roster');

function cardHTML(p) {
  const form = p.form.slice(-10).map(w => '<div class="f' + (w ? ' w' : '') + '"></div>').join('');
  return '<button class="card" data-id="' + p.id + '">' +
    '<div class="cn"><span>' + esc(p.name) + '</span>' +
      '<span class="wrbig" style="color:' + (p.wr >= 50 ? 'var(--good)' : 'var(--bad)') + '">' +
      p.wr + '%</span></div>' +
    '<div class="tag">#' + esc(p.tag) + '</div>' +
    '<div class="crow"><span class="chip">' + esc(p.role) + '</span>' +
      '<span class="chip">' + p.n + '판</span>' +
      '<span class="chip">KDA ' + p.kda + '</span>' +
      '<span class="chip">관여 ' + p.kp + '%</span></div>' +
    '<div class="form">' + form + '</div></button>';
}
function renderRoster(q) {
  q = (q || '').trim().toLowerCase();
  const qi = initials(q);
  const list = D.players.filter(p => {
    if (!q) return true;
    const n = p.name.toLowerCase(), t = (p.tag || '').toLowerCase();
    return n.includes(q) || t.includes(q) || initials(n).includes(qi);
  });
  rosterEl.innerHTML = list.map(cardHTML).join('');
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
}
document.getElementById('search').addEventListener('input', e => renderRoster(e.target.value));
rosterEl.addEventListener('click', e => {
  const b = e.target.closest('.card');
  if (b) location.hash = '#/p/' + b.dataset.id;
});

function bars(rows, unit) {
  if (!rows || !rows.length) return '<p class="muted">표본이 부족합니다.</p>';
  const mx = Math.max(...rows.map(r => r.wr != null ? r.wr : 0), 1);
  return rows.map(r => {
    const v = r.wr == null ? 0 : r.wr;
    return '<div class="bar"><span class="bl">' + esc(r.l) + '</span>' +
      '<span class="bt"><span class="bf' + (v < 50 ? ' lo' : '') + '" style="width:' +
      (v / mx * 100).toFixed(1) + '%"></span></span>' +
      '<span class="bv">' + v + (unit || '%') + ' <i>' + (r.n || 0) + '판</i></span></div>';
  }).join('');
}
function box(title, inner) { return '<div class="box"><h3>' + esc(title) + '</h3>' + inner + '</div>'; }

function renderPlayer(id) {
  const p = D.players.find(x => x.id === id);
  if (!p) { location.hash = ''; return; }
  const o = p.obj || {};
  const kpi = [['판수', p.n + '판'], ['승률', p.wr + '%'], ['주 라인', p.role],
               ['KDA', p.kda], ['킬관여', p.kp + '%'], ['분당 CS', p.cspm],
               ['시야', p.vs], ['분당딜', p.dpm]];
  const jumps = [['hof', '명예의 전당'], ['ch', '챔피언'], ['lane', '맞라인'],
                 ['team', '아군·적'], ['obj', '오브젝트'], ['map', '죽음의 지도'],
                 ['habit', '습관'], ['fb', '피드백']];
  let h = '<button class="back" id="back">← 전체 목록</button>' +
    '<h1 style="margin:0">' + esc(p.name) + ' <span class="tag">#' + esc(p.tag) + '</span></h1>' +
    '<p class="sub">' + esc(p.role) + ' · ' + p.n + '판 · 승률 ' + p.wr + '%</p>' +
    '<div class="jump">' + jumps.map(j =>
      '<button data-go="' + j[0] + '">' + j[1] + '</button>').join('') + '</div>' +
    '<div class="kpis">' + kpi.map(k =>
      '<div class="kpi"><div class="kl">' + k[0] + '</div><div class="kv">' + k[1] + '</div></div>'
    ).join('') + '</div>' +
    '<h2 id="ch">챔피언</h2><div class="grid2">' +
      box('많이 한 챔피언', bars(p.champs)) +
      box('라인 분포', bars(p.roles.map(r => ({l: r.r, n: r.n, wr: r.wr})))) + '</div>' +
    '<h2 id="lane">맞라인 상대</h2><div class="grid2">' +
      box('상대하기 편한 / 어려운 챔피언', bars(p.lane)) +
      box('적 정글별 승률', bars(p.ejg)) + '</div>' +
    '<h2 id="team">아군 · 적</h2><div class="grid2">' +
      box('같이 하면 이기는 / 지는 챔피언', bars(p.ally)) +
      box('적으로 만났을 때', bars(p.enemy)) +
      box('아군 정글별 승률', bars(p.ajg)) + '</div>' +
    '<h2 id="obj">오브젝트</h2><div class="grid2">' +
      box('용을 몇 마리 먹었나', bars((o.dragon_count || []).map(r => ({l: r.label, n: r.n, wr: r.winrate})))) +
      box('첫 용을 언제 먹었나', bars((o.first_dragon_time || []).map(r => ({l: r.label, n: r.n, wr: r.winrate})))) +
      box('어떤 용을 먹었나', bars((o.first_dragon_element || []).map(r => ({l: r.label, n: r.n, wr: r.winrate})))) +
      box('오브젝트 선취', bars((o.firsts || []).map(r => ({l: r.label, n: r.n, wr: r.winrate})))) +
      box('공허 유충', bars((o.horde_bin || []).map(r => ({l: r.label, n: r.n, wr: r.winrate})))) +
      box('15분 상황별 결과', bars(((p.cb || {}).by_lead15 || []).map(r => ({l: r.label, n: r.n, wr: r.winrate})))) +
      '</div>';
  if ((o.impact || []).length) {
    h += box('오브젝트 영향력 (획득 시 − 내줄 시)', (o.impact || []).map(r =>
      '<div class="bar"><span class="bl">' + esc(r.label) + '</span><span class="bt">' +
      '<span class="bf" style="width:' + Math.min(100, r.gap * 1.6).toFixed(0) + '%"></span></span>' +
      '<span class="bv">+' + r.gap + '%p</span></div>').join(''));
  }
  const F = p.fun || {};
  // 명예의 전당 (챔피언 섹션 앞으로 이동시키기 위해 별도 삽입)
  if ((F.hof || []).length) {
    const hof = F.hof.map(r =>
      '<div class="rec"><div class="rl">' + esc(r.label) + '</div>' +
      '<div class="rv">' + r.value.toLocaleString() + '<span style="font-size:12px">' +
      esc(r.unit || '') + '</span></div>' +
      '<div class="rm">' + esc(r.champ) + ' · ' + esc(r.when) +
      (r.win ? ' · 승' : ' · 패') + '</div></div>').join('');
    h = h.replace('<h2 id="ch">', '<h2 id="hof">명예의 전당</h2><div class="hof">' + hof +
      '</div><p class="muted">최고 기록은 판수가 많을수록 커집니다. 판수와 함께 보세요.</p>' +
      '<h2 id="ch">');
  }
  // 죽음의 지도
  const M = F.map || {};
  if (M.grid) {
    const cell = (v, mx, hue) => {
      const a = mx ? Math.min(1, v / mx) : 0;
      return '<rect x="0" y="0" width="1" height="1" fill="' + hue +
             '" fill-opacity="' + (a * 0.92).toFixed(2) + '"/>';
    };
    const mapSVG = (g, hue, label) => {
      const mx = Math.max(...g.flat(), 1);
      let r = '<svg viewBox="0 0 ' + M.grid + ' ' + M.grid + '" class="chart" ' +
              'style="width:100%;border:1px solid var(--line);border-radius:8px;background:var(--gl)">';
      for (let j = 0; j < M.grid; j++) for (let i = 0; i < M.grid; i++) {
        const v = g[j][i]; if (!v) continue;
        r += '<rect x="' + i + '" y="' + (M.grid - 1 - j) + '" width="1" height="1" fill="' + hue +
             '" fill-opacity="' + Math.min(1, v / mx * 0.95).toFixed(2) + '"><title>' + v + '</title></rect>';
      }
      r += '<line x1="0" y1="' + M.grid + '" x2="' + M.grid + '" y2="0" stroke="var(--muted)" ' +
           'stroke-width="0.06" stroke-dasharray="0.3 0.3"/></svg>';
      return '<div><h3 style="font-size:13px;margin:0 0 6px">' + label + '</h3>' + r + '</div>';
    };
    h += '<h2 id="map">죽음의 지도</h2><div class="box"><div class="maps">' +
      mapSVG(M.deaths, 'var(--bad)', '내가 죽은 곳 (' + M.n_death + '회)') +
      mapSVG(M.kills, 'var(--good)', '내가 킬 낸 곳 (' + M.n_kill + '회)') +
      '</div><p class="muted">항상 블루 진영 기준으로 뒤집어 겹쳤습니다. 왼쪽 아래가 우리 본진, 대각선이 미드입니다.</p></div>';
  }
  // 데스 부검
  if ((F.autopsy || []).length) {
    const cols = {'한타 중 사망':'#6b8cc4','교전 중 사망':'#4a9d6f','소규모 갱':'#c8a24a',
                  '솔로 패배':'#c05a5a','짤림':'#9b59b6','처형':'#7d879c'};
    const st = F.autopsy.map(r => '<div style="width:' + r.pct + '%;background:' +
      (cols[r.label] || '#888') + '">' + (r.pct >= 9 ? r.pct + '%' : '') + '</div>').join('');
    const lg = F.autopsy.map(r => '<span><i style="background:' + (cols[r.label] || '#888') +
      '"></i>' + esc(r.label) + ' ' + r.pct + '%</span>').join('');
    h += box('데스 부검 — 어쩌다 죽었나', '<div class="stack">' + st + '</div>' +
      '<div class="legend">' + lg + '</div>' +
      '<p class="muted">짤림 = 여러 명에게 아군 없이 잡힘 · 솔로 패배 = 1:1에서 짐. 3분 이후만 집계.</p>');
  }
  // 습관 (연승 / 회색화면 / 시계)
  h += '<h2 id="habit">습관과 리듬</h2><div class="grid2">';
  const S = F.streak;
  if (S) {
    const grass = (S.recent || []).map(w => '<div class="gd' + (w ? ' w' : '') + '"></div>').join('');
    h += box('연승 · 연패', '<div class="streak">' +
      '<div><div class="muted">최장 연승</div><div class="sbig" style="color:var(--good)">' +
      S.win + '</div></div>' +
      '<div><div class="muted">최장 연패</div><div class="sbig" style="color:var(--bad)">' +
      S.loss + '</div></div>' +
      '<div><div class="muted">현재</div><div class="sbig">' + S.cur +
      (S.cur_win ? '연승' : '연패') + '</div></div></div>' +
      '<div class="grass">' + grass + '</div>' +
      (S.expected ? '<p class="muted">이 승률·판수면 순전히 운으로도 ' + S.expected +
        '연승 정도는 나옵니다. 그보다 훨씬 길면 진짜 상승세.</p>' : ''));
  }
  const DS = F.dead || {};
  if (DS.pct != null) {
    h += box('회색 화면 지분', '<div class="sbig">' + DS.pct + '%</div>' +
      '<p class="muted">2~20분 동안 죽어 있던 시간 비율입니다.</p>' +
      bars((DS.curve || []).filter(c => c.m % 4 === 0).map(c =>
        ({l: c.m + '분', n: 0, wr: c.v}))));
  }
  if ((F.clock || []).length) {
    h += box('언제 이기나 (한국 시간)', bars(F.clock.map(r =>
      ({l: r.label, n: r.n, wr: r.winrate}))));
  }
  h += '</div>';

  h += '<h2 id="fb">실력 향상 피드백</h2>';
  h += (p.fb && p.fb.length)
    ? p.fb.map(t => '<div class="fb">' + t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>').join('')
    : '<p class="muted">표본이 더 쌓이면 제공됩니다.</p>';

  const v = document.getElementById('playerView');
  v.innerHTML = h;
  v.querySelector('#back').onclick = () => { location.hash = ''; };
  v.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const el = document.getElementById(b.dataset.go);
    if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  });
}
function route() {
  const m = location.hash.match(/^#\/p\/(.+)$/);
  const rv = document.getElementById('rosterView'), pv = document.getElementById('playerView');
  if (m) { rv.classList.add('hidden'); pv.classList.remove('hidden'); renderPlayer(m[1]); window.scrollTo(0, 0); }
  else { pv.classList.add('hidden'); rv.classList.remove('hidden'); }
}
window.addEventListener('hashchange', route);
renderRoster(''); route();
</script></body></html>
