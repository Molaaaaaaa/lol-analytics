<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f5f3ee;--surf:#fffefb;--line:#e0dbd0;--ink:#1b2030;--ink2:#565f73;--muted:#8b93a5;
--accent:#9a7118;--good:#2f7d55;--bad:#b3474a;--gl:#e8e3d8;--chip:#efece4}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
--bg:#0e1420;--surf:#161d2b;--line:#26304a;--ink:#e8eaf0;--ink2:#a8b0c2;--muted:#79839a;
--accent:#c8a24a;--good:#4a9d6f;--bad:#c05a5a;--gl:#222c3e;--chip:#1e2636}}
:root[data-theme=dark]{--bg:#0e1420;--surf:#161d2b;--line:#26304a;--ink:#e8eaf0;--ink2:#a8b0c2;
--muted:#79839a;--accent:#c8a24a;--good:#4a9d6f;--bad:#c05a5a;--gl:#222c3e;--chip:#1e2636}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.55;
font-family:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header{background:var(--surf);border-bottom:1px solid var(--line);padding:26px 0 18px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h1{font-family:'Chakra Petch','IBM Plex Sans KR',sans-serif;font-size:clamp(24px,4vw,36px);
margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13px;margin:6px 0 0}
#search{width:100%;margin-top:16px;padding:11px 14px;font-size:15px;border-radius:9px;
border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit}
#search:focus{outline:2px solid var(--accent);outline-offset:1px}
main{padding:22px 18px 50px}
/* 첫 화면은 '사람 고르기'가 목적이라 카드를 얇게 — 지표 비교는 '전체 순위' 탭에 있다 */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:8px}
/* 좁은 화면에서도 2열은 유지 — 1열이면 18명이 세로로 너무 길어진다 */
@media(max-width:520px){.roster{grid-template-columns:repeat(2,1fr);gap:6px}
.card{padding:8px 10px}.cn{font-size:13.5px}.wrbig{font-size:15px}.csub{font-size:11px}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:9px 12px;
cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:border-color .12s}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:none}
.cn{font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cn>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csub{margin-top:2px;font-size:11.5px;color:var(--muted);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.crow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;font-size:11.5px}
.chip{background:var(--chip);border-radius:20px;padding:2px 9px;color:var(--ink2)}
.wrbig{font-family:'Chakra Petch',sans-serif;font-size:16px;font-variant-numeric:tabular-nums;flex:none}
.form{display:flex;gap:2px;margin-top:9px}
.f{width:100%;height:5px;border-radius:2px;background:var(--bad)}
.f.w{background:var(--good)}
.hidden{display:none!important}
.fbsec{border-top:1px solid var(--line);margin:38px 0 0;padding:22px 0 6px}
.fbsec h2{margin:0 0 4px;font-size:17px}
.fbsec>p.lead{margin:0 0 14px;font-size:13px;color:var(--ink2);line-height:1.66;max-width:62ch}
.fbrow{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 9px}
.fbrow label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);flex:1;min-width:150px}
.fbsec select,.fbsec input,.fbsec textarea{padding:8px 10px;border-radius:8px;border:1px solid var(--line);
background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px;width:100%;box-sizing:border-box}
.fbsec textarea{min-height:104px;resize:vertical;line-height:1.6}
.fbsec select:focus,.fbsec input:focus,.fbsec textarea:focus{outline:none;border-color:var(--accent)}
.fbfoot{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-top:10px}
.fbsend{background:var(--accent);color:var(--bg);border:none;border-radius:8px;padding:9px 20px;
font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.fbsend:hover:not(:disabled){filter:brightness(1.12)}
.fbsend:disabled{opacity:.5;cursor:default}
.fbalt{font-size:12px;color:var(--muted)}
.fbalt a{color:var(--ink2)}
.fbmsg{font-size:12.5px;margin:9px 0 0;min-height:1.2em}
.fbmsg.ok{color:var(--good)}
.fbmsg.err{color:var(--bad)}
.fbcount{font-size:11px;color:var(--muted);margin-left:auto}
.notes{margin:26px 0 0;border-top:1px solid var(--line);padding-top:16px}
.notes>summary{cursor:pointer;font-size:13px;color:var(--ink2);list-style:none;
display:flex;align-items:center;gap:7px;user-select:none}
.notes>summary::-webkit-details-marker{display:none}
.notes>summary::before{content:'▸';color:var(--muted);transition:transform .15s}
.notes[open]>summary::before{transform:rotate(90deg)}
.notes>summary:hover{color:var(--accent)}
.nrel{margin:14px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.nrel h4{margin:0 0 7px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.nkind{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;
margin:0 0 5px;font-weight:600;letter-spacing:.02em}
.nkind.add{background:rgba(74,157,111,.16);color:#4a9d6f}
.nkind.fix{background:rgba(107,140,196,.16);color:#6b8cc4}
.nkind.imp{background:rgba(200,162,74,.16);color:#c8a24a}
.nkind.bad{background:rgba(192,90,90,.16);color:#c05a5a}
.notes ul{margin:0 0 12px;padding-left:17px}
.notes li{font-size:12.5px;line-height:1.62;color:var(--ink2);margin:0 0 4px}
.notes li b{color:var(--ink)}
.spark{display:flex;align-items:flex-end;gap:3px;height:78px;padding:4px 0}
.spark .sb{flex:1;min-height:2px;background:var(--bad);opacity:.78;border-radius:2px 2px 0 0}
.spark .sb:hover{opacity:1}
.spx{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.adj{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.adj th{text-align:right;font-weight:600;color:var(--muted);font-size:11px;
padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.adj th:first-child{text-align:left}
.adj td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;
font-variant-numeric:tabular-nums}
.adj td:first-child{text-align:left;color:var(--ink)}
.adj tr:last-child td{border-bottom:none}
.adj .mv{font-weight:600}
.adj .up{color:var(--good)}
.adj .dn{color:var(--bad)}
.adj .fl{color:var(--muted);font-weight:400}
.adj .why{font-size:11px;color:var(--muted);text-align:left;padding-top:0;padding-bottom:8px}
.rctl{display:flex;gap:9px;align-items:flex-end;flex-wrap:wrap;margin:0 0 10px}
.rctl label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.rctl select{padding:6px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
color:var(--ink);font-family:inherit;font-size:12.5px}
.rctl .chk{flex-direction:row;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);
padding-bottom:7px;cursor:pointer}
.rgroup{grid-column:1/-1;font-size:11px;letter-spacing:.08em;color:var(--muted);
text-transform:uppercase;padding:8px 2px 2px;border-bottom:1px solid var(--line);margin-top:4px}
.rgroup:first-child{margin-top:0}
.back{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;padding:0;
margin-bottom:12px;font-size:13.5px}
.jump{display:flex;gap:5px;overflow-x:auto;padding:9px 0;margin-bottom:14px;
border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.jump button{white-space:nowrap;background:var(--chip);border:1px solid transparent;color:var(--ink2);
border-radius:20px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer}
.jump button:hover,.jump button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
h2{font-family:'Chakra Petch','IBM Plex Sans KR',sans-serif;font-size:14px;letter-spacing:.1em;
text-transform:uppercase;color:var(--accent);margin:26px 0 8px;padding-bottom:7px;
border-bottom:1px solid var(--line);scroll-margin-top:52px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:1px;
background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.kpi{background:var(--surf);padding:10px 12px}
.kl{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.kv{font-family:'Chakra Petch',sans-serif;font-size:21px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.box{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.box h3{font-size:14px;margin:0 0 9px;font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px}
.bl{width:104px;flex:none;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{flex:1;height:13px;background:var(--gl);border-radius:3px;overflow:hidden}
.bf{display:block;height:100%;border-radius:3px;background:var(--good)}  /* display 필수: span은 인라인이라 width가 무시돼 막대가 안 그려진다 */
.bf.lo{background:var(--bad)}
.bf.neu{background:var(--muted);opacity:.55}
.bf.un{opacity:.38}  /* 표본이 적어 확신 없음 — 방향(색)은 유지하고 옅게만 */
.bv{width:74px;flex:none;text-align:right;font-family:'IBM Plex Mono',monospace;
font-size:11.5px;font-variant-numeric:tabular-nums}
.bv i{color:var(--muted);font-style:normal;font-size:10.5px}
.fb{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--accent);
border-radius:8px;padding:11px 14px;margin:7px 0;font-size:13.5px}
.fb b{color:var(--accent)}
.muted{color:var(--muted);font-size:12px}
.updated{font-size:12px;color:var(--ink2);margin:10px 0 0;display:flex;gap:8px;align-items:center}
.themebtn{position:absolute;top:22px;right:18px;background:var(--chip);border:1px solid var(--line);
color:var(--ink2);border-radius:20px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer;
display:flex;align-items:center;gap:6px}
.themebtn:hover,.themebtn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
header{position:relative}
@media(max-width:520px){.themebtn{top:14px;right:14px;padding:5px 10px;font-size:11.5px}}
.updated .dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.updated .dot.stale{background:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.filters select{padding:7px 9px;border-radius:7px;border:1px solid var(--line);
background:var(--bg);color:var(--ink);font-family:inherit;font-size:13px;min-width:118px}
.filters select:focus{outline:2px solid var(--accent);outline-offset:1px}
.qres{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;margin:10px 0}
.qres .big{font-family:'Chakra Petch',sans-serif;font-size:32px;font-variant-numeric:tabular-nums}
.glist{max-height:280px;overflow-y:auto;margin-top:8px}
.grow{display:grid;grid-template-columns:52px 1fr 1fr 1fr 62px;gap:6px;padding:5px 4px;
font-size:12px;border-bottom:1px solid var(--line);align-items:center}
.grow.hd{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
position:sticky;top:0;background:var(--surf)}
.tagw{color:var(--good);font-weight:600}.tagl{color:var(--bad);font-weight:600}
.livebtn{background:var(--accent);color:#12161f;border:none;border-radius:8px;padding:9px 16px;
font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.livebtn:hover,.livebtn:focus-visible{filter:brightness(1.08);outline:none}
.livebtn[disabled]{opacity:.55;cursor:default}
.lgame{border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-top:8px}
.lgame .lt{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.lstats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:6px}
.lstats b{color:var(--ink);font-family:'IBM Plex Mono',monospace}
.hof{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.rec{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.rec .rl{font-size:11px;color:var(--muted)}
.rec .rv{font-family:'Chakra Petch',sans-serif;font-size:22px;font-variant-numeric:tabular-nums}
.rec .rm{font-size:11px;color:var(--ink2)}
.rec.hero{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rec.hero .rv{color:var(--accent)}
.ld{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:6px 0 2px}
.ldc{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:10px 12px;text-align:center}
.ldc .v{font-family:'Chakra Petch',sans-serif;font-size:24px;font-variant-numeric:tabular-nums}
.ldc .k{font-size:11px;color:var(--muted)}
.two{display:flex;gap:22px;flex-wrap:wrap}
.two .v{font-family:'Chakra Petch',sans-serif;font-size:30px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink2);
padding:9px 15px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.lbctl{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:14px 0 10px}
.lbctl label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.lbctl select{padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);
color:var(--ink);font-family:inherit;font-size:13px}
.lbctl .chk{flex-direction:row;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);padding-bottom:8px}
.lb{width:100%;border-collapse:collapse;font-size:13px}
.lb th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line)}
.lb td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lb tr:hover td{background:var(--chip)}
.lb .rk{width:34px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.lb .nm{cursor:pointer;font-weight:500}
.lb .nm:hover{color:var(--accent)}
.lb .val{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600}
.rolebadge{font-size:10.5px;background:var(--chip);border-radius:10px;padding:1px 7px;color:var(--ink2);margin-left:6px}
.effrow{display:grid;grid-template-columns:40px 1fr 70px;gap:8px;align-items:center;
padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.effrow .sd{font-size:10.5px;color:var(--muted)}
.effrow.dim{opacity:.5}
.effrow .df{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600}
.mrow{display:grid;grid-template-columns:34px 1fr 74px 58px 50px;gap:7px;align-items:center;
padding:6px 3px;border-bottom:1px solid var(--line);font-size:12.5px}
.mrow.hl{background:var(--chip)}
.h2h{font-size:13px;line-height:1.75}
.h2h b{color:var(--accent)}
.streak{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.sbig{font-family:'Chakra Petch',sans-serif;font-size:30px;line-height:1}
.grass{display:flex;gap:2px;flex-wrap:wrap;margin-top:8px}
.gd{width:9px;height:9px;border-radius:2px;background:var(--bad)}
.gd.w{background:var(--good)}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;margin:8px 0}
.stack div{font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.maps{grid-template-columns:1fr}}
footer{border-top:1px solid var(--line);padding:16px 18px 40px;color:var(--muted);font-size:11.5px}
</style></head><body>
<header><button class="themebtn" id="themeBtn" type="button" aria-label="화면 테마 전환"><span id="themeIcon">🌓</span><span id="themeLabel">자동</span></button><div class="wrap">
  <p class="eyebrow">SOLO QUEUE ANALYTICS</p>
  <h1>솔랭 해체 분석기</h1>
  <p class="sub" id="sub"></p>
  <p class="updated" id="updated"></p>
  <input id="search" type="search" placeholder="닉네임 검색 (초성도 됩니다 — 예: ㅇㄱㅅ)" autocomplete="off">
</div></header>
<main class="wrap">
  <div id="rosterView">
    <div class="tabs" role="tablist">
      <button id="tabList" role="tab" aria-selected="true">닉네임 목록</button>
      <button id="tabRank" role="tab" aria-selected="false">전체 순위</button>
    </div>
    <div id="paneRank" class="hidden">
      <div class="lbctl">
        <label>기준<select id="lbMetric"></select></label>
        <label class="chk"><input type="checkbox" id="lbRole"> 같은 라인끼리만</label>
        <label>라인<select id="lbRoleSel"></select></label>
      </div>
      <div id="lbOut"></div>
      <p class="muted" id="lbNote"></p>
      <div id="h2hOut" style="margin-top:18px"></div>
    </div>
    <div id="paneList">
      <div class="rctl">
        <label>정렬<select id="rSort">
          <option value="name">가나다</option>
          <option value="n">판수 많은 순</option>
          <option value="wr">승률</option>
          <option value="form">최근 폼</option>
        </select></label>

  <div id="playerView" class="hidden"></div>
  <section class="fbsec" id="fbsec">
    <h2>피드백</h2>
    <p class="lead">이 사이트는 여러분 전적을 뜯어보고 있습니다. 숫자가 이상하거나,
      이런 걸 보고 싶다거나, 그냥 할 말이 있으면 여기 남겨주세요. 준호한테 바로 갑니다.</p>
    <div class="fbrow">
      <label>누구<select id="fbWho"></select></label>
      <label>무슨 얘기<select id="fbKind">
        <option>숫자가 이상함</option>

</main>
<footer class="wrap"><span id="foot"></span> · Riot Match-V5 / Timeline-V5 기반 ·
보정 없이 원자료 승률이며 표본이 적은 항목은 참고용입니다.</footer>
<script id="DATA" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('DATA').textContent);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- 테마: 자동(시스템) → 라이트 → 다크 순환 ----------
(function () {
  const MODES = [
    {k: 'auto',  icon: '🌓', label: '자동'},
    {k: 'light', icon: '☀️', label: '라이트'},
    {k: 'dark',  icon: '🌙', label: '다크'},
  ];
  const btn = document.getElementById('themeBtn');
  const ic = document.getElementById('themeIcon'), lb = document.getElementById('themeLabel');
  let cur = 'auto';
  try { cur = localStorage.getItem('theme') || 'auto'; } catch (e) {}
  function apply(k) {
    cur = MODES.some(m => m.k === k) ? k : 'auto';
    const root = document.documentElement;
    if (cur === 'auto') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', cur);
    const m = MODES.find(x => x.k === cur);
    if (ic) ic.textContent = m.icon;
    if (lb) lb.textContent = m.label;
    try { localStorage.setItem('theme', cur); } catch (e) {}
  }
  apply(cur);
  if (btn) btn.onclick = () => {
    const i = MODES.findIndex(m => m.k === cur);
    apply(MODES[(i + 1) % MODES.length].k);
  };
})();
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
const initials = s => [...s].map(c => {
  const i = c.charCodeAt(0) - 0xAC00;
  return (i >= 0 && i <= 11171) ? CHO[Math.floor(i / 588)] : c;
}).join('');
const col = new Intl.Collator('ko', {numeric: true, sensitivity: 'base'});
const CH = D.champ_ko || {};
// Riot 은 'FiddleSticks', Data Dragon 은 'Fiddlesticks' — 대소문자가 다르다
const CHL = Object.fromEntries(Object.entries(CH).map(([k, v]) => [k.toLowerCase(), v]));
const kch = c => CH[c] || CHL[String(c || '').toLowerCase()] || c;
// 한글 받침 유무 -> 조사 선택. '정글라도'/'미드이라도' 같은 게 안 나오게.
const batchim = w => { const s = String(w || ''); if (!s) return false;
  const c = s.charCodeAt(s.length - 1) - 0xAC00;
  return c >= 0 && c <= 11171 && (c % 28) !== 0; };
const josa = (w, withB, noB) => String(w || '') + (batchim(w) ? withB : noB);
const POS = {TOP: '탑', JUNGLE: '정글', MIDDLE: '미드', BOTTOM: '원딜', UTILITY: '서포터'};
D.players.sort((a, b) => col.compare(a.name, b.name));
document.getElementById('sub').textContent =
  D.players.length + '명 · 솔로랭크만 · ' + D.note;
document.getElementById('foot').textContent = '생성 ' + D.built;
(function () {
  const el = document.getElementById('updated');
  if (!el) return;
  const st = D.status || {};
  const when = st.last_success || D.built;
  let stale = false;
  try {
    const t = new Date(when.replace(' ', 'T'));
    stale = (Date.now() - t.getTime()) > 36 * 3600 * 1000;
  } catch (e) {}
  const failed = st.ok === false;
  el.innerHTML = '<span class="dot' + (stale || failed ? ' stale' : '') + '"></span>' +
    '마지막 갱신 <b style="color:var(--ink)">' + esc(when) + '</b>' +
    (failed ? ' <span style="color:var(--bad)">· 최근 갱신 실패: ' + esc(st.detail || '') + '</span>'
            : (stale ? ' <span style="color:var(--bad)">· 데이터가 오래됐습니다</span>' : ''));
})();

const rosterEl = document.getElementById('roster');

function cardHTML(p) {
  // 이름·승률·라인·판수만 남긴다. 태그/KDA/관여/최근폼은 마우스를 올리면 보이고,
  // 상세는 카드를 누르면 나오므로 첫 화면에 다 펼칠 이유가 없다(18명이면 그게 난잡함의 원인).
  const w = p.form.slice(-10).filter(Boolean).length, g = p.form.slice(-10).length;
  const tip = p.name + '#' + p.tag + ' · ' + p.role + ' · ' + p.n + '판 · 승률 ' + p.wr +
    '% · KDA ' + p.kda + ' · 관여 ' + p.kp + '%' + (g ? ' · 최근 ' + g + '판 ' + w + '승' : '');
  return '<button class="card" data-id="' + p.id + '" title="' + esc(tip) + '">' +
    '<div class="cn"><span>' + esc(p.name) + '</span>' +
      '<span class="wrbig" style="color:' + (p.wr >= 50 ? 'var(--good)' : 'var(--bad)') + '">' +
      p.wr + '%</span></div>' +
    '<div class="csub">' + esc(p.role) + ' · ' + p.n + '판</div></button>';
}
// ---------- 피드백 창구 ----------
(function () {
  var REPO = "https://github.com/molaaaaaaa/lol-analytics";
  var who = document.getElementById("fbWho");
  var kind = document.getElementById("fbKind");
  var body = document.getElementById("fbBody");
  var send = document.getElementById("fbSend");
  var msg = document.getElementById("fbMsg");
  var alt = document.getElementById("fbAlt");
  var cnt = document.getElementById("fbCount");
  if (!who || !send) return;

  // 이름 목록 — 로스터에서 고르거나 그냥 두면 익명
  var opts = ['<option value="">익명으로</option>'];
  (D.players || []).forEach(function (p) {
    opts.push('<option value="' + esc(p.name) + '">' + esc(p.name) + "</option>");
  });
  who.innerHTML = opts.join("");
  try {
    var last = localStorage.getItem("fbWho");
    if (last) who.value = last;
  } catch (e) {}
  who.onchange = function () {
    try { localStorage.setItem("fbWho", who.value); } catch (e) {}
  };

  body.oninput = function () {
    cnt.textContent = body.value.length + " / 2000";
  };

  // 지금 보고 있는 화면 — 어느 사람 페이지에서 남겼는지 같이 보낸다
  function where() {
    var m = (location.hash || "").match(/#\/p\/([a-f0-9]+)/);
    if (!m) return "목록";
    var p = (D.players || []).filter(function (x) { return x.id === m[1]; })[0];
    return p ? p.name + " 페이지" : "개인 페이지";
  }

  function issueURL() {
    var t = "[" + kind.value + "] " + (body.value.split("\n")[0] || "").slice(0, 60);
    var b = body.value + "\n\n---\n화면: " + where() + "\n남긴이: " + (who.value || "익명");
    return REPO + "/issues/new?title=" + encodeURIComponent(t) + "&body=" + encodeURIComponent(b);
  }
  function showAlt(label) {
    alt.innerHTML = label + ' <a href="' + issueURL() + '" target="_blank" rel="noopener">GitHub Issues에 남기기</a>';
  }
  showAlt("또는");

  send.onclick = function () {
    var t = body.value.trim();
    if (t.length < 5) {
      msg.className = "fbmsg err";
      msg.textContent = "내용을 다섯 글자 이상 적어주세요.";
      return;
    }
    send.disabled = true;
    msg.className = "fbmsg";
    msg.textContent = "보내는 중...";
    fetch("/api/feedback", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ who: who.value, kind: kind.value, body: t, page: where() }),
    })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (r) {
        if (r.j && r.j.ok) {
          msg.className = "fbmsg ok";
          msg.textContent = "고맙습니다. 잘 받았습니다.";
          body.value = "";
          cnt.textContent = "0 / 2000";
          send.disabled = false;
          return;
        }
        msg.className = "fbmsg err";
        msg.textContent = (r.j && r.j.error) || "전송에 실패했습니다.";
        send.disabled = false;
        if (r.j && r.j.fallback === "github") showAlt("대신");
      })
      .catch(function () {
        msg.className = "fbmsg err";
        msg.textContent = "전송에 실패했습니다. 아래 링크로 남겨주세요.";
        send.disabled = false;
        showAlt("대신");
      });
  };
})();

// ---------- 패치 노트 (원본: 저장소의 PATCHNOTES.md) ----------
(function () {
  const el = document.getElementById('notes');
  const N = D.notes || [];
  if (!el || !N.length) { if (el) el.remove(); return; }
  const cls = k => k === '추가' ? 'add' : k === '수정' ? 'fix' : k === '사고' ? 'bad' : 'imp';
  // 굵게(**...**)만 허용. 나머지는 전부 이스케이프한다.
  const md = t => esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
                        .replace(/`([^`]+)`/g, '<code>$1</code>');
  el.innerHTML = '<summary>패치 노트 · 최근 갱신 ' + esc(N[0].date) + '</summary>' +
    N.map(r => '<div class="nrel"><h4>' + esc(r.date) + '</h4>' +
      r.groups.map(gp => '<div><span class="nkind ' + cls(gp.kind) + '">' + esc(gp.kind) +
        '</span></div><ul>' + gp.items.map(i => '<li>' + md(i) + '</li>').join('') + '</ul>'
      ).join('') + '</div>').join('');
})();

const ROLE_ORDER = ['탑', '정글', '미드', '원딜', '서포터', '미상'];
function formScore(p) {
  const f = (p.form || []).slice(-10);
  return f.length ? f.reduce((a, b) => a + b, 0) / f.length : 0;
}
function renderRoster(q) {
  q = (q || '').trim().toLowerCase();
  const qi = initials(q);
  let list = D.players.filter(p => {
    if (!q) return true;
    const n = p.name.toLowerCase(), t = (p.tag || '').toLowerCase();
    return n.includes(q) || t.includes(q) || initials(n).includes(qi);
  });
  const sort = (document.getElementById('rSort') || {}).value || 'name';
  const cmp = {
    n: (a, b) => b.n - a.n,
    name: (a, b) => col.compare(a.name, b.name),
    wr: (a, b) => b.wr - a.wr,
    form: (a, b) => formScore(b) - formScore(a),
  }[sort] || ((a, b) => col.compare(a.name, b.name));
  list = [...list].sort(cmp);

  if ((document.getElementById('rGroup') || {}).checked) {
    const by = {};
    list.forEach(p => { (by[p.role] = by[p.role] || []).push(p); });
    const order = ROLE_ORDER.filter(r => by[r])
      .concat(Object.keys(by).filter(r => !ROLE_ORDER.includes(r)));
    rosterEl.innerHTML = order.map(r =>
      '<div class="rgroup">' + esc(r) + ' ' + by[r].length + '명</div>' +
      by[r].map(cardHTML).join('')).join('');
  } else {
    rosterEl.innerHTML = list.map(cardHTML).join('');
  }
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
}
['rSort', 'rGroup'].forEach(id => {
  const e = document.getElementById(id);
  if (e) e.onchange = () => renderRoster(document.getElementById('search').value);
});
// ---------- 전체 순위 ----------
const METRICS = [
  {k:'wr', l:'승률', f:p=>p.wr, u:'%', hi:true},
  {k:'kda', l:'KDA', f:p=>p.kda, u:'', hi:true},
  {k:'kp', l:'킬 관여율', f:p=>p.kp, u:'%', hi:true},
  {k:'cspm', l:'분당 CS', f:p=>p.cspm, u:'', hi:true},
  {k:'dpm', l:'분당 딜', f:p=>p.dpm, u:'', hi:true},
  {k:'vs', l:'시야 점수', f:p=>p.vs, u:'', hi:true},
  {k:'ldg', l:'15분 골드 격차', f:p=>((p.ld||{}).m15||{}).gold, u:'G', hi:true},
  {k:'ldc', l:'15분 CS 격차', f:p=>((p.ld||{}).m15||{}).cs, u:'', hi:true},
  {k:'dead', l:'죽어 있던 시간(낮을수록 좋음)', f:p=>((p.fun||{}).dead||{}).pct, u:'%', hi:false},
  {k:'throw', l:'던진 판(낮을수록 좋음)', f:p=>(p.cb||{}).throw_rate, u:'%', hi:false},
  {k:'come', l:'뒤집은 판', f:p=>(p.cb||{}).comeback_rate, u:'%', hi:true},
  {k:'streak', l:'최장 연승', f:p=>((p.fun||{}).streak||{}).win, u:'연승', hi:true},
  {k:'penta', l:'펜타킬', f:p=>{const h=((p.fun||{}).hof||[]).find(x=>x.label==='펜타킬');return h?h.value:0;}, u:'회', hi:true},
  {k:'fb', l:'퍼스트블러드', f:p=>{const h=((p.fun||{}).hof||[]).find(x=>x.label==='퍼스트블러드');return h?h.value:0;}, u:'회', hi:true},
  {k:'sdpg', l:'판당 피솔킬(낮을수록 좋음)', f:p=>(p.sd||{}).per_game, u:'', hi:false},
  {k:'skpg', l:'판당 솔킬', f:p=>(p.sd||{}).given_per_game, u:'', hi:true},
  {k:'snet', l:'솔킬 수지 (준 − 당한)', f:p=>(p.sd||{}).net_per_game, u:'', hi:true},
];
const ROLE_SENSITIVE = new Set(['cspm','dpm','vs','ldg','ldc','kp','sdpg','skpg','snet']);
const mSel = document.getElementById('lbMetric');
METRICS.forEach(m=>{const o=document.createElement('option');o.value=m.k;o.textContent=m.l;mSel.appendChild(o);});
const roleSel = document.getElementById('lbRoleSel');
[...new Set(D.players.map(p=>p.role))].sort((a,b)=>col.compare(a,b)).forEach(r=>{
  const o=document.createElement('option');o.value=r;o.textContent=r;roleSel.appendChild(o);});

function renderRank(){
  const m = METRICS.find(x=>x.k===mSel.value)||METRICS[0];
  const onlyRole = document.getElementById('lbRole').checked;
  const want = roleSel.value;
  let rows = D.players.map(p=>({p, v:m.f(p)})).filter(r=>r.v!=null && !isNaN(r.v));
  if (onlyRole) rows = rows.filter(r=>r.p.role===want);
  // 승률은 표본이 47~465판으로 제각각이라 원자료로 줄세우면 표본 잡음이 등수가 된다.
  // 윌슨 95% 하한으로 정렬하고 구간을 함께 보여준다.
  if (m.k === 'wr') {
    rows.forEach(r => { const ci = wilson(Math.round(r.v/100*r.p.n), r.p.n);
      r.lo = ci[0]*100; r.hi2 = ci[1]*100; });
    rows.sort((a,b)=> b.lo - a.lo);
  } else {
    rows.sort((a,b)=> m.hi ? b.v-a.v : a.v-b.v);
  }
  // 동점은 같은 등수로 (연승·펜타킬은 대부분이 동점이라 인덱스를 등수로 쓰면 사실상 가나다순이 된다)
  let rk = 0, prev = null;
  rows.forEach((r, i) => { const key = m.k === 'wr' ? r.lo : r.v;
    if (key !== prev) { rk = i + 1; prev = key; } r.rk = rk; });
  const out = document.getElementById('lbOut');
  if(!rows.length){ out.innerHTML='<p class="muted">해당 조건에 표시할 사람이 없습니다.</p>'; return; }
  out.innerHTML = '<table class="lb"><thead><tr><th></th><th>닉네임</th>'+
    '<th style="text-align:right">'+esc(m.l)+'</th><th style="text-align:right">판수</th></tr></thead><tbody>'+
    rows.map((r,i)=>'<tr><td class="rk">'+r.rk+'</td>'+
      '<td class="nm" data-id="'+r.p.id+'">'+esc(r.p.name)+
      '<span class="rolebadge">'+esc(r.p.role)+'</span></td>'+
      '<td class="val">'+(typeof r.v==='number'? Math.round(r.v*10)/10 : r.v)+esc(m.u)+
        (m.k==='wr' ? '<span style="color:var(--muted);font-weight:400;font-size:11px"> '+
          Math.round(r.lo)+'~'+Math.round(r.hi2)+'</span>' : '')+'</td>'+
      '<td class="val" style="color:var(--muted);font-weight:400">'+r.p.n+'</td></tr>').join('')+
    '</tbody></table>';
  const warn = (!onlyRole && ROLE_SENSITIVE.has(m.k));
  let note = onlyRole
    ? esc(want)+' 포지션인 사람만 골랐습니다. 다만 수치 자체는 그 사람의 <b>전 라인 평균</b>이라 부계정 라인이 섞여 있습니다.'
    : (warn ? '⚠ 라인이 섞여 있습니다. 이 지표는 포지션마다 기준이 달라 그대로 비교하면 안 됩니다. 위 체크박스를 켜세요.'
            : '판수가 적은 사람은 순위가 크게 흔들립니다.');
  if (m.k === 'wr') note = '18명 전원의 95% 구간이 서로 겹칩니다 — 이 순서는 실력 차이라기보다 <b>표본 잡음</b>입니다. '
    + '표본이 많을수록 위로 오도록 윌슨 하한으로 정렬했습니다.';
  document.getElementById('lbNote').innerHTML = note;
  out.querySelectorAll('.nm').forEach(td=>td.onclick=()=>{location.hash='#/p/'+td.dataset.id;});
}
function renderH2H(){
  const el = document.getElementById('h2hOut');
  const rows = D.h2h||[];
  if(!el) return;
  if(!rows.length){ el.innerHTML='<p class="muted">아직 서로 만난 판이 없습니다.</p>'; return; }
  const same = rows.filter(r=>r.same), vs = rows.filter(r=>!r.same);
  const pair = {};
  vs.forEach(r=>{const k=r.a+' vs '+r.b; pair[k]=pair[k]||{n:0,aw:0,a:r.a,b:r.b}; pair[k].n++; pair[k].aw+=r.awin?1:0;});
  const duo = {};
  same.forEach(r=>{const k=r.a+' + '+r.b; duo[k]=duo[k]||{n:0,w:0}; duo[k].n++; duo[k].w+=r.awin?1:0;});
  el.innerHTML = '<h3 style="font-size:15px;margin:0 0 6px">우리끼리 만난 판</h3>'+
    '<p class="h2h">총 <b>'+rows.length+'판</b> — 같은 팀 <b>'+same.length+'판</b> / 맞붙은 <b>'+vs.length+'판</b></p>'+
    (Object.keys(duo).length? '<p class="h2h">👥 '+Object.entries(duo).map(([k,v])=>
      esc(k)+' '+v.n+'판 '+Math.round(v.w/v.n*100)+'%').join(' · ')+'</p>':'')+
    (Object.keys(pair).length? '<p class="h2h">⚔ '+Object.entries(pair).map(([k,v])=>

function wilson(w, n) {
  if (!n) return [0, 1];
  const z = 1.96, p = w / n, d = 1 + z * z / n;
  const c = (p + z * z / (2 * n)) / d;
  const m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
  return [Math.max(0, c - m), Math.min(1, c + m)];
}
// mode: 'rate'(승률, 50% 기준 편차)  'volume'(판수 길이)  'plain'(단순 값)
function bars(rows, opt) {
  opt = opt || {};
  const mode = opt.mode || 'rate';
  if (!rows || !rows.length) return '<p class="muted">아직 판수가 모자라요.</p>';
  const unit = opt.unit != null ? opt.unit : '%';
  const maxN = Math.max(...rows.map(r => r.n || 0), 1);
  const maxV = Math.max(...rows.map(r => r.wr == null ? 0 : r.wr), 1);
  return rows.map(r => {
    const v = r.wr == null ? 0 : r.wr, n = r.n || 0;
    let width, cls = '', mark = '';
    if (mode === 'volume') {
      width = n / maxN * 100; cls = 'neu';
    } else if (mode === 'plain') {
      width = Math.min(100, v / (opt.max || maxV) * 100); cls = 'neu';
    } else {
      // 승률: 50%에서 얼마나 벗어났나(±25%p 만점).
      // 방향(위/아래)은 색으로, 확신은 진하기로 표현한다.
      const enough = n >= 6;
      // 표본이 모자라면 숫자를 '—'로 감추므로 막대도 그리지 않는다
      // (안 그러면 "데이터 부족"인데 막대만 꽉 찬 모순이 생긴다).
      width = enough ? Math.min(100, Math.abs(v - 50) / 25 * 100) : 0;
      const ci = wilson(Math.round(v / 100 * n), n);
      const sure = enough && (ci[0] > 0.5 || ci[1] < 0.5);
      // 회색(neu)으로 뭉개면 70%와 30%가 같은 길이·같은 색이 되어 구분이 안 된다 → 색은 유지, 옅게.
      cls = (v >= 50 ? '' : 'lo') + (sure ? '' : ' un');
      if (sure) mark = v >= 50 ? ' ▲' : ' ▼';
    }
    const val = (mode === 'rate' && n > 0 && n < 6) ? '—'
              : (v.toFixed ? v.toFixed(1).replace(/\.0$/, '') : v) + unit;
    return '<div class="bar"><span class="bl" title="' + esc(r.l) + '">' + esc(r.l) + '</span>' +
      '<span class="bt"><span class="bf ' + cls + '" style="width:' + width.toFixed(1) + '%"></span></span>' +
      '<span class="bv">' + val + mark +
      (r.n != null && r.n > 0 ? ' <i>' + r.n + '판</i>' : '') + '</span></div>';
  }).join('');
}

  const S = F.streak;
  if (S) {
    const grass = (S.recent || []).map(w => '<div class="gd' + (w ? ' w' : '') + '"></div>').join('');
    h += box('연승 · 연패', '<div class="streak">' +
      '<div><div class="muted">최장 연승</div><div class="sbig" style="color:var(--good)">' +
      S.win + '</div></div>' +
      '<div><div class="muted">최장 연패</div><div class="sbig" style="color:var(--bad)">' +
      S.loss + '</div></div>' +
      '<div><div class="muted">현재</div><div class="sbig">' + S.cur +
      (S.cur_win ? '연승' : '연패') + '</div></div></div>' +
      '<div class="grass">' + grass + '</div>' +
      (S.expected ? '<p class="muted">이 승률·판수면 순전히 운으로도 ' + S.expected +
        '연승 정도는 나옵니다. 그보다 훨씬 길면 진짜 상승세.</p>' : ''));
  }
  const DS = F.dead || {};
  if (DS.pct != null) {
    h += box('죽어 있던 시간', '<div class="sbig">' + DS.pct + '%</div>' +
      '<p class="muted">2~20분 동안 죽어 있던 시간 비율입니다. 낮을수록 좋습니다.</p>' +
      bars((DS.curve || []).filter(c => c.m % 4 === 0).map(c =>
        ({l: c.m + '분', wr: c.v})), {mode: 'plain', max: 30}));
  }
  if ((F.clock || []).length) {
    h += box('언제 이기나 (한국 시간)', bars(F.clock.map(r =>
      ({l: r.label, n: r.n, wr: r.winrate}))));
  }
  h += '</div>';

  // ---- 자유 조합 조회 ----
  if ((p.games || []).length) {
    const uniq = (k) => [...new Set(p.games.map(g => g[k]).filter(Boolean))].sort(
      (a, b) => col.compare(a, b));
    const sel = (id, lab, opts) => '<label>' + lab +
      '<select id="' + id + '"><option value="">전체</option>' +
      opts.map(o => '<option>' + esc(o) + '</option>').join('') + '</select></label>';
    h += '<h2 id="query">조합 조회</h2><div class="box">' +
      '<p class="note">조건을 골라 그 상황의 전적만 볼 수 있습니다. ' +
      '조합이 좁을수록 표본이 작아지니 판수를 함께 보세요.</p>' +
      '<div class="filters">' +
        sel('fC', '내 챔피언', uniq('c')) + sel('fR', '내 라인', uniq('r')) +
        sel('fO', '맞라인 상대', uniq('o')) + sel('fE', '적 정글', uniq('ej')) +
        sel('fA', '아군 정글', uniq('aj')) +
      '</div><div id="qout"></div></div>';
  }

  // ---- 경기 목록 ----
  if ((p.recent || []).length) {
    h += '<h2 id="games">최근 경기 목록</h2><div class="box">' +
      '<div class="mrow" style="color:var(--muted);font-size:10.5px">' +
      '<span>결과</span><span>챔피언</span><span>KDA</span><span>CS</span><span>날짜</span></div>' +
      p.recent.map(g => '<div class="mrow" id="m_' + esc(g.id) + '">' +
        '<span class="' + (g.w ? 'tagw' : 'tagl') + '">' + (g.w ? '승' : '패') + '</span>' +
        '<span>' + esc(g.c) + ' <span class="muted">' + esc(g.r) + ' · ' + g.m + '분</span></span>' +
        '<span style="font-family:IBM Plex Mono,monospace">' + esc(g.kda) + '</span>' +
        '<span style="font-family:IBM Plex Mono,monospace">' + g.cs + '</span>' +
        '<span class="muted">' + esc(g.d.slice(5)) + '</span></div>').join('') +
      '</div>';
  }

  h += '<h2 id="fb">고칠 점</h2>';
  h += (p.fb && p.fb.length)
    ? p.fb.map(t => '<div class="fb">' + t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</div>').join('')
    : '<p class="muted">표본이 더 쌓이면 제공됩니다.</p>';

  // ---- 챔피언 보정 표 ----
  const Z = (p.zs || []).filter(z => z.pct_raw != null);
  if (Z.length) {
    const band = q => q >= 50 ? '상위 ' + Math.max(1, Math.round(100 - q)) + '%'
                              : '하위 ' + Math.max(1, Math.round(q)) + '%';
    const rows = [...Z].sort((a, b) => a.pct - b.pct).map(z => {
      const mv = z.pct - z.pct_raw;
      const cls = Math.abs(mv) < 4 ? 'fl' : (mv > 0 ? 'up' : 'dn');
      const am = Math.round(Math.abs(mv));
      const arrow = am === 0 ? '' : (mv > 0 ? '▲' : '▼') + am;
      const drv = (z.drivers || []).filter(x => x.share != null && x.n >= 5 &&
                    Math.abs(x.share) >= .2 && (x.share < 0) === !!z.higher_better)
                  .sort((a, b) => Math.abs(b.share) - Math.abs(a.share)).slice(0, 2);
      let r = '<tr><td>' + esc(z.ko) + '</td><td>' + z.me + '</td><td class="fl">' + z.exp +
        '</td><td class="fl">' + band(z.pct_raw) + '</td><td class="mv ' + cls + '">' +
        band(z.pct) + ' <span style="font-size:11px">' + arrow + '</span></td></tr>';
      if (drv.length && Math.abs(mv) >= 4) {
        r += '<tr><td class="why" colspan="5">↳ ' +
          drv.map(x => esc(x.champ) + ' ' + x.n + '판').join(' · ') +
          ' 때문에 기대치가 ' + (mv > 0 ? '낮' : '높') + '게 잡힙니다</td></tr>';
      }
      return r;
    }).join('');
    h += '<div class="box" style="margin-top:14px">' +
      '<h3 style="margin:0 0 4px;font-size:13px">챔피언을 감안하면</h3>' +
      '<p class="muted" style="margin:0 0 8px">같은 ' + esc(josa(p.role, '이라도', '라도')) +
      ' 고르는 챔피언마다 기대 딜량·CS·시야가 ' +
      '애초에 다릅니다. 그래서 <b>내가 고른 챔피언들의 평균</b>을 기대치로 잡고, 거기서 얼마나 ' +
      '벗어났는지로 다시 줄을 세웠습니다. 기대치는 <b>본인 판을 통째로 뺀</b> 값이라 자기 성적이 ' +
      '자기 기준이 되는 일은 없습니다.</p>' +
      '<div style="overflow-x:auto"><table class="adj"><tr><th>지표</th><th>내 값</th>' +
      '<th>챔프 기대치</th><th>안 따지면</th><th>감안하면</th></tr>' + rows + '</table></div>' +
      '<p class="muted">' + ((p.zs[0] || {}).pop_kind === 'own'
        ? '비교 대상은 <b>' + esc(p.name) + '님이 실제로 뛴 경기에 나온 같은 라인 선수 ' +
          ((p.zs[0] || {}).pop || 0).toLocaleString() + '명</b>입니다(본인 제외). ' +
          '매칭 시스템이 실력을 맞춰 넣어준 사람들이라 "같은 라인 N명 중 몇 등"이 그대로 성립합니다. ' +
          '대부분 1판씩만 나오므로 평균만 이 집단에서 쓰고, 흩어진 정도는 라인 전체 표본에서 가져왔습니다 ' +
          '— 작은 집단에서 산포를 직접 재면 0으로 무너져 사소한 차이가 "하위 1%"로 튑니다.'
        : '비교 대상은 이 데이터에 등장한 같은 라인 전원' +
          ((p.zs[0] || {}).pop ? ' ' + p.zs[0].pop.toLocaleString() + '명' : '') +
          '입니다(본인 제외). 1~2판만 나온 사람이 대부분이라 그 표본 잡음은 분산분해로 걷어냈습니다.') +
      '</p></div>';
  }

  const v = document.getElementById('playerView');
  v.innerHTML = h;
  v.querySelector('#back').onclick = () => { location.hash = ''; };
  v.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const el = document.getElementById(b.dataset.go);
    if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
  });

  const ids = ['fC', 'fR', 'fO', 'fE', 'fA'], keys = ['c', 'r', 'o', 'ej', 'aj'];
  const out = document.getElementById('qout');
  function runQuery() {
    if (!out) return;
    const want = ids.map(i => (document.getElementById(i) || {}).value || '');
    const rows = (p.games || []).filter(g => keys.every((k, i) => !want[i] || g[k] === want[i]));
    const n = rows.length, w = rows.reduce((s, g) => s + g.w, 0);
    const wr = n ? (w / n * 100).toFixed(1) : '—';
    const note = n === 0 ? '<span class="muted">조건에 맞는 경기가 없습니다.</span>'
      : (n < 5 ? '<span class="muted">표본이 ' + n + '판뿐이라 승률은 참고만 하세요.</span>' : '');
    out.innerHTML = '<div class="qres"><span class="big" style="color:' +
      (n && w / n >= 0.5 ? 'var(--good)' : 'var(--bad)') + '">' + wr + '%</span>' +
      '<span>' + n + '판 · ' + w + '승 ' + (n - w) + '패</span>' + note + '</div>' +
      (n ? '<div class="glist"><div class="grow hd"><span>결과</span><span>내 챔프</span>' +
        '<span>맞라인</span><span>적 정글</span><span>날짜</span></div>' +
        rows.slice(0, 60).map(g => '<div class="grow">' +
          '<span class="' + (g.w ? 'tagw' : 'tagl') + '">' + (g.w ? '승' : '패') + '</span>' +
          '<span>' + esc(g.c) + '</span><span>' + esc(g.o || '—') + '</span>' +
          '<span>' + esc(g.ej || '—') + '</span><span class="muted">' + esc(g.d) + '</span>' +
          '</div>').join('') +
        (n > 60 ? '<p class="muted">최근 60판만 표시</p>' : '') + '</div>' : '');
  }
  ids.forEach(i => { const el = document.getElementById(i); if (el) el.onchange = runQuery; });
  runQuery();

  // 명예의 전당 카드 클릭 → 같은 날짜 경기로 스크롤 + 강조
  v.querySelectorAll('.rec').forEach(card => {
    const when = (card.querySelector('[data-when]') || {}).dataset?.when;
    if (!when) return;
    const hit = (p.recent || []).find(g => g.d === when);
    if (!hit) return;                    // 최근 목록에 없는 옛 기록은 클릭 대상이 아니다
    card.style.cursor = 'pointer';
    card.title = '이 경기로 이동';
    card.onclick = () => {
      const el = document.getElementById('m_' + hit.id);
      if (!el) return;
      v.querySelectorAll('.mrow.hl').forEach(x => x.classList.remove('hl'));
      el.classList.add('hl');
      el.scrollIntoView({behavior: 'smooth', block: 'center'});
    };
  });

  const lb = document.getElementById('liveBtn'), lo = document.getElementById('liveOut');
  if (lb) lb.onclick = async () => {
    lb.disabled = true; lb.textContent = '불러오는 중…';
    lo.innerHTML = '';
    try {
      const q = '?name=' + encodeURIComponent(p.name) + '&tag=' + encodeURIComponent(p.tag);
      const res = await fetch('/api/recent' + q);
      const j = await res.json();
      if (j.error) {
        lo.innerHTML = '<p class="muted" style="color:var(--bad)">' + esc(j.error) + '</p>';
      } else if (!(j.games || []).length) {
        lo.innerHTML = '<p class="muted">최근 솔로랭크 경기가 없습니다.</p>';
      } else {
        lo.innerHTML = j.games.map(g => {
          const when = new Date(g.playedAt);
          const ago = Math.max(0, Math.round((Date.now() - when.getTime()) / 3600000));
          return '<div class="lgame"><div class="lt">' +
            '<span class="' + (g.win ? 'tagw' : 'tagl') + '">' + (g.win ? '승리' : '패배') + '</span>' +
            '<b>' + esc(kch(g.champion)) + '</b>' +
            '<span class="muted">' + esc(POS[g.position] || g.position || '') +
            (g.opponent ? ' · vs ' + esc(kch(g.opponent)) : '') +
            (g.enemyJungler ? ' · 적정글 ' + esc(kch(g.enemyJungler)) : '') +
            '</span><span class="muted">' + (ago < 24 ? ago + '시간 전' : when.toLocaleDateString('ko-KR')) +
            ' · ' + g.durationMin + '분</span></div>' +
            '<div class="lstats"><span>KDA <b>' + esc(g.kda) + '</b></span>' +
            '<span>CS <b>' + g.cs + '</b> (분당 ' + g.cspm + ')</span>' +
            '<span>킬관여 <b>' + g.killParticipation + '%</b></span>' +
            '<span>딜비중 <b>' + g.damageShare + '%</b></span>' +
            '<span>시야 <b>' + g.visionScore + '</b></span></div></div>';
        }).join('');
      }
    } catch (e) {
      lo.innerHTML = '<p class="muted" style="color:var(--bad)">불러오지 못했습니다: ' + esc(e.message) + '</p>';
    }
    lb.disabled = false; lb.textContent = '다시 불러오기';
  };
}
function route() {
  const m = location.hash.match(/^#\/p\/(.+)$/);
  const rv = document.getElementById('rosterView'), pv = document.getElementById('playerView');
  if (m) { rv.classList.add('hidden'); pv.classList.remove('hidden'); renderPlayer(m[1]); window.scrollTo(0, 0); }
  else { pv.classList.add('hidden'); rv.classList.remove('hidden'); }
}
window.addEventListener('hashchange', route);
renderRoster(''); route();
</script></body></html>
